app: 涂鸦智能
case_order: 5
module: 划区清扫
cases:
- name: 划区清扫完整流程
  priority: P1
  wait: 5
  steps:
  - desc: 打开清扫模式选择
    click: 切换清扫模式.png
  - desc: 选择划区清扫
    click: 划区清扫
    screenshot: screenshots/划区清扫_01_选择划区清扫.png
  - desc: 确认清扫模式
    click: 确认
  - desc: 添加清扫区域
    click: 清扫区域
    screenshot: screenshots/划区清扫_02_添加区域.png
  - desc: 开始划区清扫
    click: 开始清扫.png
    screenshot: screenshots/划区清扫_03_开始清扫.png
  - desc: 确认设备处于划区清扫状态
    assert: 划区清扫
    timeout: 30
    screenshot: screenshots/划区清扫_04_清扫状态.png
  - desc: 等待清扫完成并返回充电
    assert: 充电中,充电完成
    timeout: 0
    screenshot: screenshots/划区清扫_05_清扫完成.png
  - desc: 展开清扫数据并抓取面积和时间
    click: 展开清扫数据.png
    grab: 面积,时间
    screenshot: screenshots/划区清扫_06_主界面清扫数据.png
  - desc: 进入设置界面
    click: 进入设置.png
    screenshot: screenshots/划区清扫_07_进入设置.png
  - desc: 进入清扫记录界面
    click: 清扫记录
    screenshot: screenshots/划区清扫_08_清扫记录界面.png
  - desc: 点击最新一条清扫记录
    screenshot: screenshots/划区清扫_09_最新清扫记录.png
    latest_record: true
  - desc: 对比清扫面积和时间是否一致
    match: 面积,时间
