module: 全局清扫
cases:
- name: 全局清扫
  priority: P1
  steps:
  - desc: 点击开始清扫
    click_template: 开始清扫.png
    screenshot: true
  # ★ 用户 2026-10-19 纠正: 点“开始清扫”后会先进入 3 分钟以上的清洗拖布状态,
  #   这是正常流程(不是时序竞争); 洗完后**不会自动开始清扫**, 必须再点一次“开始清扫”。
  #   所以 then 分支里: 等洗拖布结束 → 再点一次开始清扫 → 后面才断言“正在清洁”。
  - desc: 判断是否清洗拖布
    if: 清洗拖布
    threshold: 1.0
    screenshot: true
    wait: 5
    then:
    - desc: 等待拖布清洗完成
      sleep: 180.0
    - desc: 清洗完成后重新点击开始清扫
      click_template: 开始清扫.png
      screenshot: true
  - desc: 判断是否处于清扫状态
    assert: 正在清洁
    screenshot: true
    timeout: 60
  # ★ 用户 2026-10-16 要求: 检测到清扫状态后**等 2 分钟**, 再按「开始回充」模板点回充
  #   (让机器人回座, 后面的「判断是否清扫完成」才等得到烘干)。回充之后那步判据不变。
  - desc: 清扫 2 分钟后点击回充
    sleep: 120
  - desc: 点击回充按钮(模板)
    click_template: 开始回充.png
    screenshot: true
  # ★ 用户 2026-10-19: "是因为有清扫记录的弹窗才会点不到菜单按钮和烘干状态",
  #   且"点回充后需要判断一下是否有清扫记录的悬浮卡片再清除, 不然是无效点击"。
  #   所以: 先等悬浮卡出现(清扫结束后才弹, 回充那一刻还没有 —— 实测立刻点=空气),
  #   再用 `if` 判断它在不在, **在才点空白处**把它清掉。
  - desc: 等待清扫记录悬浮卡出现(20s)
    sleep: 20
  - desc: 判断是否有清扫记录悬浮卡
    if: 今天,已取消,昨天,已完成
    screenshot: true
    then:
    - desc: 清除清扫记录弹窗(点击空白处)
      click: 540,660
      screenshot: true
  - desc: 判断是否清扫完成
    assert: 干燥拖布
    screenshot: true
    timeout: 0
    wait: 10
  # ★ 进菜单前的悬浮卡由下面这个 `if` 自己判断+清除(用户 2026-10-19 的设计:
  #   "所以才通过判断今天, 昨天去取消这个弹窗") —— 卡片不在时不点, 免得无效点击。
  - desc: 检测菜单界面是否可见
    if: 今天,已取消,昨天,已完成
    threshold: 0.6
    screenshot: true
    then:
    - desc: 清除提示
      click: 540,700
      screenshot: true
      wait: 10
    - desc: 进入菜单界面
      click: 菜单
      screenshot: true
    else:
    - desc: 进入菜单界面
      click: 菜单
      screenshot: true
  - desc: 进入清扫报告界面
    click: 打扫报告
    wait: 15
  - desc: 等待清扫记录加载
    sleep: 5.0
    screenshot: true
  wait: 5
