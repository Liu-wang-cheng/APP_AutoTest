module: 全局清扫
cases:
- name: 全局清扫
  priority: P1
  steps:
  - desc: 点击开始清扫
    click_template: 开始清扫.png
    screenshot: true
  - desc: 判断是否清洗拖布
    if: 清洗拖布
    threshold: 1.0
    screenshot: true
    wait: 5
    then:
    - desc: 等待拖布清洗完成
      sleep: 180.0
  - desc: 判断是否处于清扫状态
    assert: 正在清洁
    screenshot: true
    timeout: 60
  # ★ 用户 2026-10-16 要求: 检测到清扫状态后**等 2 分钟**, 再按「开始回充」模板点回充
  #   (让机器人回座, 后面的「判断是否清扫完成」才等得到烘干)。回充之后那步判据不变。
  - desc: 清扫 2 分钟后点击回充
    sleep: 120
  - desc: 点击回充按钮(模板)
    click_template: 开始回充.png
    screenshot: true
  - desc: 判断是否清扫完成
    assert: 干燥拖布
    screenshot: true
    timeout: 0
    wait: 10
  - desc: 检测菜单界面是否可见
    if: 今天,已取消,昨天,已完成
    threshold: 0.6
    screenshot: true
    then:
    - desc: 清除提示
      click: 540,700
      screenshot: true
      wait: 10
    - desc: 进入菜单界面
      click: 菜单
      screenshot: true
    else:
    - desc: 进入菜单界面
      click: 菜单
      screenshot: true
  - desc: 进入清扫报告界面
    click: 打扫报告
    wait: 15
  - desc: 等待清扫记录加载
    sleep: 5.0
    screenshot: true
  wait: 5
