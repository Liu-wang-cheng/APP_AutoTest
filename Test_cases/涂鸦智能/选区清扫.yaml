case_order: 4
module: 选区清扫
cases:
- name: 选区清扫完整流程
  priority: P1
  wait: 5
  steps:
  - desc: 检查设备处于充电状态
    assert: 充电完成,充电中
  - desc: 在主页识别地图房间分区
    room_zones: true
  - desc: 打开清扫模式选择
    click: 切换清扫模式.png
  - desc: 选择选区清扫
    click: 选区清扫
    screenshot: screenshots/选区清扫_01_选择选区清扫.png
  - desc: 确认清扫模式
    click: 确认
  - desc: 点击识别的房间分区
    room_click: 2
  - desc: 点击开始清扫按钮
    click: 开始清扫.png
    screenshot: screenshots/选区清扫_02_开始清扫.png
  - desc: 确认设备处于选区清扫状态
    assert: 选区清扫中,清扫中
    timeout: 60
    screenshot: screenshots/选区清扫_03_清扫状态.png
  - desc: 等待清扫完成并返回充电
    assert: 充电中,充电完成
    timeout: 0
    screenshot: screenshots/选区清扫_04_清扫完成.png
  - desc: 展开清扫数据并抓取面积和时间
    click: 展开清扫数据.png
    grab: 面积,时间
    screenshot: screenshots/选区清扫_05_主界面清扫数据.png
  - desc: 进入设置界面
    click: 进入设置.png
    screenshot: screenshots/选区清扫_06_进入设置.png
  - desc: 进入清扫记录界面
    click: 清扫记录
    screenshot: screenshots/选区清扫_07_清扫记录界面.png
  - desc: 点击最新一条清扫记录
    screenshot: screenshots/选区清扫_08_最新清扫记录.png
    latest_record: true
  - desc: 对比清扫面积和时间是否一致
    match: 面积,时间
