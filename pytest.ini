[pytest]
markers =
    smoke: 冒烟用例(P0)
    regression: 回归用例
    real_collapse: 验证界面的"APP 组默认收起"真实行为(绕过 conftest 的统一展开)
testpaths = tests
norecursedirs = .venv .git reports __pycache__ logs
# tests/ 是包(有 __init__.py),显式把项目根加入 sys.path,
# 使 import core.* / import gui.* 在任何启动目录下都能解析
pythonpath = .
addopts = -v --tb=short
