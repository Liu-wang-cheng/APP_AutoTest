name: 发版

# 方案 B(用户 2026-10-16): **全自动 CD** —— 把"已经提交好的版本"发出去。
# 触发二选一:
#   · Actions 页面手动 Run workflow(填 version, 如 2.0.27)  ← 推荐, 不会和 tag 打架
#   · 推 tag: git tag v2.0.27 && git push origin v2.0.27
# 版本号三处(VERSION / core/version.py / CHANGELOG 该节)由 release.py 自己把闸 ——
# 不一致直接拒绝(轻则界面版本号不对, 重则用户更新不到)。
#
# ★ 三个必须写清的坑(本地发版时逐个踩过, 别再踩):
#   ① **不能**让 release.py 自己查 CI 闸门: 它查的是"这个提交的 check runs", 而此刻跑的
#      就是它自己(状态还是 in_progress) → 自我卡死。测试由同一 job 里的 build.bat
#      (pytest 不过就 exit /b 1, 后续步骤不会执行)兜住, 所以这里用 --no-ci-check。
#   ② tag 触发的运行默认是 **detached HEAD** → 必须显式 checkout master, 否则 release.py
#      更新完 version.json 后 `git push origin master` 无处可推。
#   ③ CI 里**没有 git 身份** → release.py 的 commit 会失败, 先配 github-actions[bot]。
#
# ★ **全自动**(用户 2026-10-16: "不需要人工审核了, 改成全自动"): 触发即发布, 不设
#   Environment 审批闸门。想拿它做演练(不发布只打包)就把 dry_run 勾上。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 要发布的版本号(必须已在 VERSION / CHANGELOG 里提交好)
        required: true
        type: string
      dry_run:
        description: 演练(只打包、传 artifact, **不发布**)
        required: false
        default: false
        type: boolean
  push:
    tags: ['v*.*.*']

# 建 Release、推 version.json 提交与 tag 都需要写权限。用 job 级最小权限声明,
# **不需要**把仓库默认的 workflow 权限改成 read/write。
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master             # 见坑 ②: 发版要基于 master
          fetch-depth: 0
          # ★ 推 version.json 与 tag 用的是 checkout 存下的凭据(见坑 ④)。
          #   仓库规则(ruleset「合入规则」要求 pytest 状态检查)会拦下**新增提交**的推送,
          #   除非推送身份在 bypass 名单里 —— 所以要么在 ruleset 里给 GitHub Actions 放行,
          #   要么配一个 RELEASE_TOKEN(PAT) 并用它 checkout。没配就退回默认 token(行为不变)。
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 配 git 身份(见坑 ③)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "预检: 这个身份能不能推 master(不能就先停下, 别建 Release)"
        # ★ 为什么要有它: release.py 的顺序是「先建 Release/传资产, 再推 version.json」——
        #   万一推被仓库规则拦住, 就会留下「Release 已经发出去、但用户看到的清单还是旧的」
        #   这种半成品(v2.0.27 就这么中过一次: Release 有了、version.json 没更新, 用户
        #   在检查更新里看不到新版)。能推才继续, 放在打包之前, 早失败早省时间。
        # ★ 探针必须是**一个真实的新提交**(2026-10-16 修): 原来直接 dry-run 推当前 HEAD,
        #   那是个 no-op(Everything up-to-date), 仓库规则根本没机会拦 —— 于是"预检通过、
        #   正式推送被 GH013 拒绝"。这里先造一个空提交再 dry-run 推, 推完立刻 reset 掉;
        #   --dry-run 只跟服务器协商, 不会真的在远端留下任何东西。
        shell: pwsh
        run: |
          git commit --allow-empty -m "probe: 预检能否推送 master(不发布)" | Write-Host
          $out = git push --dry-run origin "HEAD:refs/heads/master" 2>&1
          $code = $LASTEXITCODE
          git reset --hard HEAD~1 | Write-Host
          $out | Write-Host
          if ($code -ne 0) {
            throw "当前身份推不了 master(仓库规则要求 pytest 状态检查, 而新增提交必须过它) —— 二选一: ① 在 ruleset 的 bypass 名单里加上 GitHub Actions; ② 配一个 RELEASE_TOKEN(PAT) 供 checkout 使用"
          }

      - name: tag 触发时先确认"tag 就在 master 上"(避免发错提交)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git fetch --tags --force origin
          $tag = "${{ github.ref_name }}"
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          $head = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $head) {
            throw "tag $tag 指向 $tagCommit, 而 master HEAD 是 $head —— 拒绝发布(请先把 tag 推到 master HEAD 上)"
          }

      - name: 定版本号(手动填的优先, 否则取 tag 名去掉 v)
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart('v') }
          if (-not $v) { throw "拿不到版本号" }
          Write-Host "将发布: $v"
          "VERSION=$v" >> $env:GITHUB_OUTPUT

      # ★ name 值里不能有「冒号+空格」(会被 YAML 当成映射) —— 带冒号时一律加引号
      - name: "测试 + 打包(build.bat: pytest → PyInstaller → 产物校验 → 打 zip)"
        shell: cmd
        run: build.bat

      - name: "演练: 只打包(不发布)"
        if: github.event.inputs.dry_run == 'true'
        shell: cmd
        run: python tools/release.py --pack-only --version ${{ steps.ver.outputs.VERSION }}

      - name: "演练: 上传 zip 供下载(不发布)"
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AutoTest-dryrun-${{ github.run_id }}
          path: dist/AutoTest_v*.zip
          retention-days: 3
          if-no-files-found: error

      - name: 发布(传 Release → 更新 version.json → 打 tag → 验下载链路)
        if: github.event.inputs.dry_run != 'true'
        shell: cmd
        env:
          # gh CLI 认 GH_TOKEN; release.py 认 GITHUB_TOKEN —— 两个都给上
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/release.py --version ${{ steps.ver.outputs.VERSION }} --no-ci-check
