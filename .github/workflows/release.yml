name: 发版

# 方案 B(用户 2026-10-16): **全自动 CD** —— 把"已经提交好的版本"发出去。
# 触发二选一:
#   · Actions 页面手动 Run workflow(填 version, 如 2.0.27)  ← 推荐, 不会和 tag 打架
#   · 推 tag: git tag v2.0.27 && git push origin v2.0.27
# 版本号三处(VERSION / core/version.py / CHANGELOG 该节)由 release.py 自己把闸 ——
# 不一致直接拒绝(轻则界面版本号不对, 重则用户更新不到)。
#
# ★ 三个必须写清的坑(本地发版时逐个踩过, 别再踩):
#   ① **不能**让 release.py 自己查 CI 闸门: 它查的是"这个提交的 check runs", 而此刻跑的
#      就是它自己(状态还是 in_progress) → 自我卡死。测试由同一 job 里的 build.bat
#      (pytest 不过就 exit /b 1, 后续步骤不会执行)兜住, 所以这里用 --no-ci-check。
#   ② tag 触发的运行默认是 **detached HEAD** → 必须显式 checkout master, 否则 release.py
#      更新完 version.json 后 `git push origin master` 无处可推。
#   ③ CI 里**没有 git 身份** → release.py 的 commit 会失败, 先配 github-actions[bot]。
#
# ★ **全自动**(用户 2026-10-16: "不需要人工审核了, 改成全自动"): 触发即发布, 不设
#   Environment 审批闸门。想拿它做演练(不发布只打包)就把 dry_run 勾上。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 要发布的版本号(必须已在 VERSION / CHANGELOG 里提交好)
        required: true
        type: string
      dry_run:
        description: 演练(只打包、传 artifact, **不发布**)
        required: false
        default: false
        type: boolean
  push:
    tags: ['v*.*.*']

# 建 Release、推 version.json 提交与 tag 都需要写权限。用 job 级最小权限声明,
# **不需要**把仓库默认的 workflow 权限改成 read/write。
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master             # 见坑 ②: 发版要基于 master
          fetch-depth: 0
          # ★ 推 version.json / tag 用的是 checkout 存下的凭据, 而仓库规则(ruleset
          #   「合入规则」要求 pytest 状态检查)会拦下**新增提交**的推送 —— 除非推送
          #   身份在 ruleset 的 bypass 名单里。Actions 自带的 GITHUB_TOKEN(应用 id
          #   15368)**不在**名单里, 名单里那条是 DeployKey(见坑 ④)。
          #   所以这里用**部署密钥** checkout(SSH): 它是写权限的部署密钥, 命中
          #   `DeployKey` 那条 bypass, 推送才过得去。
          #   没配这个 secret 时 ssh-key 为空 → checkout 退回默认 token(行为与以前一致,
          #   但那时推送会被规则拒 —— 预检那一步会先拦下来并说明)。
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 配 git 身份(见坑 ③)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "预检: 推送身份必须是 ruleset bypass 名单里的部署密钥(+ 真推一次验证能写)"
        # ★ 为什么要有它: release.py 的顺序是「先建 Release/传资产, 再推 version.json」——
        #   万一推被仓库规则拦住, 就会留下「Release 已经发出去、但用户看到的清单还是旧的」
        #   这种半成品(v2.0.27 就这么中过一次: Release 有了、version.json 没更新, 用户
        #   在检查更新里看不到新版)。能推才继续, 放在打包之前, 早失败早省时间。
        # ★ 为什么是"查身份 + 真推探针分支"而不是"dry-run 探一次"(2026-10-16 两次实测教训):
        #   · `git push --dry-run` **完全不会触发服务端规则**(本地造了个 pre-receive 钩子
        #     拒绝一切, dry-run 依然返回 0) —— 拿它当预检**永远通过**, 等于没有;
        #   · 真正往 master 探一次要留提交再回退, 还会各触发一轮 CI, 代价太大。
        #   而失败模式是**确定**的: 规则要求 pytest 状态检查, 只有 ruleset bypass 名单里的
        #   身份能新增提交; Actions 自带的 GITHUB_TOKEN(app id 15368)**不在**名单里
        #   (名单里那条是 DeployKey)。所以没配部署密钥就直接拦下; 配了则真推一个**探针
        #   分支**证明它真能写(用例/静态检查只在 master 上触发, 探针分支不产生额外 CI)。
        # ★ 为什么判断写在 run 里而不是 `if:`(踩过): `secrets` 上下文**不能**用在 `if:`,
        #   用了连 workflow 都解析不了(dispatches 直接 422 "Unrecognized named-value")。
        shell: pwsh
        env:
          KEY_SET: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          if ($env:KEY_SET -ne 'true') {
            throw "没配仓库 secret RELEASE_DEPLOY_KEY —— 用 Actions 自带的 GITHUB_TOKEN 推 version.json 会被仓库规则拒(GH013 Required status check), 那样会留下'Release 已发、清单没更新'的半成品。请加一个**写权限部署密钥**并把私钥存成 secret RELEASE_DEPLOY_KEY(ruleset 的 bypass 名单里已有 DeployKey 一条)。"
          }
          git config user.name  "release-precheck"
          git config user.email "release-precheck@users.noreply.github.com"
          $b = "__release_probe"
          git commit --allow-empty -m "probe: 发版预检能否推送(不发布)" | Write-Host
          $out = git push origin "HEAD:refs/heads/$b" 2>&1
          $code = $LASTEXITCODE
          git reset --hard HEAD~1 | Write-Host
          git push --quiet origin --delete $b 2>&1 | Write-Host   # 清理, 失败不影响判定
          $out | Write-Host
          if ($code -ne 0) {
            throw "部署密钥推不了这个仓库(检查它是否还在这台仓库的 Deploy keys 里、是否有写权限、secret RELEASE_DEPLOY_KEY 是否与它配对)"
          }

      - name: tag 触发时先确认"tag 就在 master 上"(避免发错提交)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git fetch --tags --force origin
          $tag = "${{ github.ref_name }}"
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          $head = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $head) {
            throw "tag $tag 指向 $tagCommit, 而 master HEAD 是 $head —— 拒绝发布(请先把 tag 推到 master HEAD 上)"
          }

      - name: 定版本号(手动填的优先, 否则取 tag 名去掉 v)
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart('v') }
          if (-not $v) { throw "拿不到版本号" }
          Write-Host "将发布: $v"
          "VERSION=$v" >> $env:GITHUB_OUTPUT

      # ★ name 值里不能有「冒号+空格」(会被 YAML 当成映射) —— 带冒号时一律加引号
      - name: "测试 + 打包(build.bat: pytest → PyInstaller → 产物校验 → 打 zip)"
        shell: cmd
        run: build.bat

      - name: "演练: 只打包(不发布)"
        if: github.event.inputs.dry_run == 'true'
        shell: cmd
        run: python tools/release.py --pack-only --version ${{ steps.ver.outputs.VERSION }}

      - name: "演练: 上传 zip 供下载(不发布)"
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AutoTest-dryrun-${{ github.run_id }}
          path: dist/AutoTest_v*.zip
          retention-days: 3
          if-no-files-found: error

      - name: 发布(传 Release → 更新 version.json → 打 tag → 验下载链路)
        if: github.event.inputs.dry_run != 'true'
        shell: cmd
        env:
          # gh CLI 认 GH_TOKEN; release.py 认 GITHUB_TOKEN —— 两个都给上
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/release.py --version ${{ steps.ver.outputs.VERSION }} --no-ci-check
