name: 真机冒烟

# 方案 C2(2026-10-16): 在**自建 runner**(那台连着模拟器/真机的机器)上跑一条真机用例,
# 目的只有一个 —— 每天/每次改动后确认"APP + 机器人这条链路还通不通"。
#
# ★ 触发**故意只留手动和定时**, 没有 pull_request —— 本仓库是 public,
#   自建 runner 一旦被 fork 的 PR 触发, 别人就能在你的机器上执行任意代码。
#   将来若要接 PR, 必须加: if: github.event.pull_request.head.repo.full_name == github.repository
#
# ★ 冒烟集(用户 2026-10-16 定): 三星 APP 的「全局清扫」。
#   为什么用 --group 而不是只给 --case: 涂鸦组也有含"全局清扫"字样的用例,
#   只给 --case 会一次跑两条(两家 APP 的模板与页面都不一样)。
#
# ★★ 冒烟用的用例/前置/模板 = **用户那台工具在用的那一套, 已整份入库**
#    (用户 2026-10-16 的三句原话: "CICD 跑的冒烟测试用桌面 APP_Test 里那条全局清扫"
#     → "这个测试用例你直接替换过来用, 不要直接用桌面上那个" → "防止一修改 CICD 就跑不了了")。
#    所以: `Test_cases/三星/全局清扫.yaml`(验证过可完整执行)、`Test_cases/三星/templates/`
#    (含 停止烘干/结束烘干 —— 前置要用)、`Test_preconditions/三星.yaml` 都以**仓库里的副本**
#    为准; CI **不去够桌面路径**, 桌面文件改名/挪走/换机器都不会让冒烟失效。
#    唯一的例外是 config/config.yaml(被 .gitignore, 含本机设备信息, 没法入库)——
#    仓库里放了一份 `config/config.ci.yaml`(内容=用户那台工具在用的配置), 跑前复制成
#    config.yaml。**改配置只改这一处**, 别让 CI 依赖仓库外的文件。
on:
  workflow_dispatch:
    inputs:
      case:
        description: 跑哪条用例(模糊匹配, 留空=默认冒烟集)
        required: false
        default: ''
      group:
        description: APP 组目录名(精确, 留空=三星)
        required: false
        default: ''
  # ★ 定时**先关着**(用户 2026-10-16 定: "等冒烟测试验证通过了再开定时")。
  #   开启条件 = 手动跑一次真机冒烟**绿了**(含设备在线/前置能过/用例跑完), 然后:
  #     ① 取消下面两行注释(cron 是 **UTC**: 那两行 = 北京 02:00, 夜里没人用设备);
  #     ② 顺手在 docs/CICD.md 的 3.5 里记一句"定时已开"。
  # schedule:
  #   - cron: '0 18 * * *'

jobs:
  smoke:
    # 只落在注册时带 realtest 标签的那台机器上(云端 runner 连不到你的设备)
    runs-on: [self-hosted, windows, realtest]
    timeout-minutes: 30
    steps:
      # ★ node24 版 action(2026-10-16 升级, 消掉 Node.js 20 弃用警告)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ★ 不用 actions/setup-python(2026-10-19 实测, 冒烟第一次真跑就死在这):
      #   自建 runner 的进程环境里带着 NoDefaultCurrentDirectoryInExePath=1 —— cmd 不再从
      #   "当前目录"找可执行文件。setup-python 在 Windows 上的安装脚本正是:
      #     cmd /c "cd <toolcache> && call python-3.13.16-amd64.exe ..."
      #   于是必报 ##[error]'python-3.13.16-amd64.exe' is not recognized as an internal
      #   or external command → Error happened during Python installation。
      #   ★ 给它设 env 也救不了(实测过两轮): 步骤 env 只能**覆盖**、不能删除 runner 进程的
      #     变量, 而 cmd 对"存在但为空"的变量仍然视为已定义(只有彻底删除才恢复搜索:
      #     实测 empty→exit 1, 删除→exit 0, '0'/'false' 同样无效)。
      #   所以改用这台 runner 上**已经装好的** Python(3.13; 可用仓库变量 SMOKE_PYTHON
      #   指定路径), 依赖装进 RUNNER_WORKSPACE 下的复用 venv —— 不污染系统 Python,
      #   也不用在每次跑之前先装一份 Python。
      - name: 选用本机 Python(自建 runner)
        shell: pwsh
        run: |
          $py = "${{ vars.SMOKE_PYTHON }}"
          if (-not $py) { $py = "C:\Python\python.exe" }
          if (-not (Test-Path $py)) {
            throw "找不到 Python: $py —— 请把仓库变量 SMOKE_PYTHON 指向这台机器上的 Python 3.13"
          }
          $v = (& $py -c "import sys; print('%d.%d' % sys.version_info[:2])").Trim()
          if ($v -ne "3.13") { throw "需要 Python 3.13, 实际 $v ($py)" }
          Write-Host "Python: $py ($(& $py --version))"
          "SMOKE_PY=$py" >> $env:GITHUB_ENV

      - name: 安装依赖
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_WORKSPACE 'smoke-venv'
          if (-not (Test-Path "$venv\Scripts\python.exe")) { & $env:SMOKE_PY -m venv $venv }
          $py = Join-Path $venv 'Scripts\python.exe'
          "SMOKE_PY=$py" >> $env:GITHUB_ENV
          & $py -m pip install --upgrade pip
          & $py -m pip install -r requirements.txt
          & $py -c "import uiautomator2, cv2, numpy, yaml; print('deps ok')"

      - name: "准备冒烟配置(用仓库里提交的 config/config.ci.yaml)"
        # ★ 用例/前置/模板**直接入库**用(用户 2026-10-16: "这个测试用例你直接替换过来用,
        #   不要直接用桌面上那个" + "防止一修改 CICD 就跑不了了")—— CI 只读仓库, 桌面那份
        #   改名/挪走/换机器都不会让冒烟失效。
        # ★ 只有 config/config.yaml 例外: 它被 .gitignore(含本机设备信息、由 GUI 回写),
        #   没法入库, 所以仓库里放一份 config/config.ci.yaml(内容 = 用户那台工具在用的配置),
        #   跑之前复制成 config.yaml。改配置只需改这一处。
        shell: pwsh
        run: |
          if (-not (Test-Path config/config.ci.yaml)) { throw "缺少 config/config.ci.yaml(冒烟用的配置)" }
          Copy-Item config/config.ci.yaml config/config.yaml -Force
          # 留个指纹: 日志里能看出**这次跑的是哪一版**用例/配置(排查"改了没生效"最快的一招)
          foreach ($f in @("Test_cases/三星/全局清扫.yaml", "config/config.ci.yaml")) {
            $i = Get-Item $f
            Write-Host ("  {0}  改于 {1}  大小 {2}  sha256 {3}" -f $f, $i.LastWriteTime,
                        $i.Length, (Get-FileHash $f -Algorithm SHA256).Hash.Substring(0, 12))
          }

      - name: "探活设备(设备没起来就明说, 别让用例背锅)"
        shell: pwsh
        run: |
          $dev = "${{ vars.SMOKE_DEVICE }}"
          if (-not $dev) { $dev = "127.0.0.1:7555" }
          adb connect $dev | Write-Host
          $out = adb devices | Out-String
          Write-Host $out
          if ($out -notmatch ([regex]::Escape($dev) + "\s+device")) {
            throw "模拟器/真机没在线($dev) —— 请先启动模拟器再重跑本 workflow(可用仓库变量 SMOKE_DEVICE 改地址)"
          }
          "SMOKE_DEV=$dev" >> $env:GITHUB_ENV

      - name: 跑真机冒烟
        shell: pwsh
        env:
          # ★ 进哪台机器(APP 设备列表里可能同时挂着 0050/0087/0090 好几台): 用仓库变量
          #   SMOKE_DEVICE_NAME 指定(如「扫地机器人 0050」)。留空 = 用 config.ci.yaml 里的
          #   target_device。实测踩过: 配置里少一个空格(扫地机器人0087)就永远匹配不到 →
          #   没进设备页, 后续全跑在列表页上。
          SMOKE_DEVICE_NAME: ${{ vars.SMOKE_DEVICE_NAME }}
        run: |
          $group = "${{ github.event.inputs.group }}"
          if (-not $group) { $group = "三星" }
          $case = "${{ github.event.inputs.case }}"
          if (-not $case) { $case = "全局清扫" }
          Write-Host "冒烟: 组=$group 用例=$case 设备=$env:SMOKE_DEV python=$env:SMOKE_PY"
          & $env:SMOKE_PY -m pytest tests/test_yaml_runner.py -q -rs `
            --mode real --device "$env:SMOKE_DEV" --group "$group" --case "$case" `
            --junit-xml=reports/junit-real.xml

      - name: "失败时上传现场(junit + 截图 + 调试产物)"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: real-failure-${{ github.run_id }}
          path: |
            reports/junit-real.xml
            Test_cases/*/screenshots/**
            Test_img/debug/**
          retention-days: 7
          if-no-files-found: ignore
