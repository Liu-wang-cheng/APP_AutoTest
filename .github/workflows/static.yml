name: 静态检查

# 方案 C1(2026-10-16): 与设备无关的质量门禁 —— 几十秒跑完, 拦的是"静默失效"那类问题:
#   · pyflakes: 未定义名/未用导入(比如重构后忘了改引用);
#   · tools/validate_cases.py: 用例 YAML 里写了不存在的键、越界阈值 —— 这类错误在引擎里
#     往往是"这一步被悄悄跳过", 真机跑完才发现少做了事。
# ★ 覆盖率**先只观测**, 不设门槛(门槛要等积累几个月的真实数字再定, 否则就是逼自己刷测试数)。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: 安装检查工具
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes pyyaml

      - name: pyflakes(未定义名/未用导入)
        run: python -m pyflakes core gui tools vlm

      - name: 用例 YAML 静态校验(键名/取值/阈值范围)
        run: python tools/validate_cases.py
