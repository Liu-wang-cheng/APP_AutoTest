name: 测试

# CI = push/PR 之后 GitHub 自动用一台**干净机器**跑一遍测试。
# 为什么需要: 本地跑靠"记得跑"; 换机器、别人提交、改完忘了跑, 都靠它兜住。
# 为什么用 windows 而不是 ubuntu: 这程序是 Windows 专用的 —— 替换脚本是 cmd 批处理、
#   打包产物是 exe、还有一批 test_updater 的用例标了 WIN_ONLY(在 Linux 上会被跳过),
#   在 Linux 上跑等于"过滤掉了最容易坏的那部分"。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:          # 也允许在 Actions 页面手动点一下跑

# 同一分支连着 push 时, 取消上一轮未完成的跑(省 CI 分钟)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # ★ action 版本 = 跑在 **node24** 上的那些(2026-10-16 升级): 旧版(v4/v5)是 node20,
      #   GitHub 已在日志里刷 "Node.js 20 is deprecated ... forced to run on Node.js 24" ——
      #   升级到 node24 版本消掉这个警告, 也免得哪天 node20 真被摘掉时集体失效。
      #   checkout 从 v5 起、setup-python / upload-artifact 从 v6 起是 node24(实测 action.yml)。
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip                     # 依赖装了 200MB+, 缓存能省几分钟

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑测试
        # 失败时把日志一起贴出来, 免得还要自己复现
        # ★ 同时写 junit.xml: 失败时作为 artifact 上传, 便于在 Actions 页面下载排查
        #   (pytest.ini 没配 addopts, 这里直接命令行加)
        run: python -m pytest -q --junit-xml=reports/junit.xml

      - name: 失败时上传 junit 报告(便于下载排查)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit-${{ github.run_id }}
          path: reports/junit.xml
          if-no-files-found: ignore
          retention-days: 7
