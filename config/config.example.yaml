# ================= 配置模板 =================
# 实际运行请复制为 config/config.yaml(含设备序列号,不入库,GUI 会自动回写)

app:
  name: 涂鸦智能          # 被测APP名(包名自动检测依据,中英文均可)
  package: com.tuya.smartiot
  main_activity: com.smart.ThingSplashActivity

# APP 内要进入的设备页面名称(前置阶段自动点击进入),留空则不进设备页
target_device: SE3L

device:
  default: 127.0.0.1:5555   # --device auto 时使用;真机填 USB 序列号
  list:
    - id: 127.0.0.1:5555
      name: 模拟器

runner:
  step_interval: 3        # 每步间隔秒
  default_timeout: 30     # assert 超时(0 = 无限等待)
  click_timeout: 10       # click 超时
  screenshot_on_fail: true
  # trace_limit: 8        # 失败回溯保留的步数

# VLM 视觉后端(预留,引擎已可插拔,后端本体未实现)
# vlm:
#   enabled: false
#   impl: vlm.glm4v:Glm4vBackend

# ── OTA 自动更新(可选) ──
# repository 留空 = **不检查更新**(默认): 免得在企业网里对着一个瞎猜的仓库外联。
# 填上 GitHub 的 owner/repo 后: 启动后延迟几秒检查一次, 之后每 8 小时自动检测;
# 用例执行期间一律跳过(不打扰真机测试)。
update:
  enabled: true
  repository: ""            # 如 your-name/Auto_test
  version_file: "version.json"
  check_interval_hours: 8
  # mirrors 一般不用改 —— 国内访问 GitHub 慢时按延迟自动挑最快的一个。
  # ★ 版本清单永远走 GitHub 直连(CDN 会缓存, 走镜像会读到旧版本号);
  #   只有下载安装包才用下面的 download_prefix 加速。
  # mirrors:
  #   - name: github
  #     base_url: "https://raw.githubusercontent.com/{repo}/main"
  #     download_prefix: ""
  #   - name: ghfast
  #     base_url: "https://ghfast.top/https://raw.githubusercontent.com/{repo}/main"
  #     download_prefix: "https://ghfast.top/"
