# 定位器集中配置: 换 APP 时主要改这个文件。
# 用例 YAML 通过 ${section.key} 引用,如 click: ${TuyaT4.start_clean}
#
# 说明: 定位串支持三种形式 ——
#   文本             "确认"         textContains,回退 description
#   =精确文本        "= 快速建图"   精确 text(注意源 APP 的文本带前导空格)
#   XPath           "//*[@text='X']"
#   模板图           "开始清扫.png"
#
# TuyaT4 section 由 D:\APP_Test_v1.4\project_config\Tuya_C22.yaml 迁移而来,
# 复杂层级 XPath 已规范化为单行(XPath 中 / 前后的空白无意义)。

通用:
  确认按钮: 确认
  返回按钮: 返回

# spot_clean(定点清扫复合动作)的 APP 适配参数:
# 合并优先级 = 代码内置默认 < 本段 < 用例步骤参数;换 APP 只改这一段
spot_clean:
  mode_btn: 切换清扫模式.png       # 打开清扫模式选择的模板图
  mode_text: 指哪扫哪              # 模式菜单里的选项文本
  confirm: 确认                    # 模式确认按钮
  mode_dialog_title: 选择清扫模式  # 模式选单标题(用于确认选单已关闭)
  start_btn: 开始清扫.png          # 开始清扫模板图
  state_texts: 指哪扫哪中,局部清扫,清扫中   # 已进入清扫状态的标志文本(逗号分隔)
  dock_texts: 充电中,充电完成      # 清扫结束回充的标志文本(逗号分隔)
  expand_btn: 展开清扫数据.png     # 清扫数据面板的展开模板图(箭头朝下)
  collapse_btn: 收起清扫数据.png   # 面板的收起模板图(箭头朝上),匹配不到时原位收回
  panel_text: 清扫面积             # 面板已展开的标志文本
  area_key: 面积                   # 抓取/对比用的面积关键词
  time_key: 时间                   # 抓取/对比用的时长关键词
  max_rooms: 3                     # 点位无效时最多换几个分区

勿扰:
  开关: 勿扰打开.png

预约清扫:
  添加按钮: 添加预约.png
  确认按钮: 确认

清扫记录:
  最新记录: 清扫记录

